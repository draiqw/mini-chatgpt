# Мини-ChatGPT
#   браузер → nginx ─ /      → frontend (статика)
#                   └ /api/  → api (FastAPI) ─→ llm (llama.cpp, Qwen3-1.7B, контекст 12k)
#                                            ├→ redis → worker (дообучение в фоне)
#                                            └→ db (Postgres: история и задачи)
# Наружу открыт только nginx. Остальные сервисы видны только внутри сети compose.
# Настройки -- в .env в корне репозитория (пример: .env.example).
# Запуск из корня: docker compose up -d --build (корневой compose.yaml подключает этот файл).
# Пути ниже -- относительно этой папки: ../.. -- корень репозитория.

x-app-env: &app-env
  LLM_URL: http://llm:8001
  LLM_MODEL: ${LLM_MODEL:-Qwen3-1.7B-Q8_0.gguf}
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql://chat:${POSTGRES_PASSWORD:-chat}@db:5432/chat

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["${PORT:-80}:80"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # http, порт 80
      - ../nginx/app.conf:/etc/nginx/snippets/app.conf:ro        # маршруты: /, /api/, /api/chat
      - ../../services/frontend:/usr/share/nginx/html:ro         # страница чата
      - certbot-www:/var/www/certbot:ro                          # проверка Let's Encrypt (scripts/issue-cert)
    depends_on: [api]
    restart: unless-stopped

  api:
    # api и worker собираются из одного Dockerfile (код -- services/backend), у worker другая команда запуска
    build: &backend-build
      context: ../..
      dockerfile: infrastructure/docker/backend/Dockerfile
    environment: *app-env
    depends_on:
      llm: {condition: service_started}
      redis: {condition: service_started}
      db: {condition: service_healthy}
    restart: unless-stopped

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    # -c 24576 при -np 2: два слота по 12288 токенов контекста, два пользователя генерируют одновременно
    command: ["-m", "/models/${LLM_MODEL:-Qwen3-1.7B-Q8_0.gguf}", "--host", "0.0.0.0", "--port", "8001",
              "-c", "24576", "-np", "2", "-t", "${LLM_THREADS:-6}", "--jinja", "--metrics"]
    # ЛОГ: llama.cpp сам пишет по каждому запросу prompt eval time и eval time (токенов в секунду)
    volumes: ["../../models:/models:ro"]
    healthcheck:   # встроенная проверка образа стучится в :8080, а мы слушаем :8001
      test: ["CMD", "curl", "-fs", "http://localhost:8001/health"]
      interval: 10s
      start_period: 60s
    restart: unless-stopped

  worker:
    build: *backend-build
    command: celery -A mini_chatgpt.worker.celery_app worker --loglevel=info --concurrency=1   # ЛОГ: info -- видно каждую задачу
    environment: *app-env
    volumes: ["weights:/weights"]
    depends_on:
      redis: {condition: service_started}
      db: {condition: service_healthy}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--loglevel", "verbose"]   # ЛОГ: видно подключения api и worker
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
      POSTGRES_DB: chat
    # ЛОГ Postgres: log_statement=mod -- писать каждый INSERT/UPDATE (вместе с комментарием /* rid=… */
    # от api и worker), log_connections -- новые подключения, log_line_prefix -- время и адрес клиента
    command: ["postgres", "-c", "log_statement=mod", "-c", "log_connections=on",
              "-c", "log_line_prefix=%m [db] %r "]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chat"]
      interval: 5s
      start_period: 20s
    restart: unless-stopped

volumes:
  weights:
  pgdata:
  certbot-www:
