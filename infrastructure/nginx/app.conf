# Маршруты приложения. Подключается в оба server: http (nginx.conf) и https (https.conf.template).

# общие настройки прокси для всех location ниже
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Request-ID $request_id;    # ЛОГ: rid уходит в api; по нему ищем запрос в логах всех сервисов
proxy_connect_timeout 3s;                     # api остановлен -> 504 через 3 с, а не через минуту

location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
}

location /api/ {
    proxy_pass http://api/;                   # /api/jobs/1 -> /jobs/1
    proxy_read_timeout 30s;
}

location = /api/chat {
    limit_req zone=chat burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api/chat;
    proxy_buffering off;                      # токены отдавать сразу, не копить
    proxy_read_timeout 300s;                  # генерация длинного ответа
}
