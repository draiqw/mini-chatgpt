# Одна строка на запрос: откуда пришёл, куда nginx его отправил, чем ответили и сколько ждали.
#   connect -- подключение к api, header -- до первого байта ответа (для стрима: до заголовков),
#   up_total -- весь ответ api, total -- всё время запроса со стороны nginx.
log_format trace '$time_iso8601 rid=$request_id [$remote_addr → nginx → $upstream_addr] "$request" '
                 '$status bytes=$body_bytes_sent up_status=$upstream_status '
                 'connect=$upstream_connect_time header=$upstream_header_time up_total=$upstream_response_time '
                 'total=$request_time limit=$limit_req_status ua="$http_user_agent"';
access_log /var/log/nginx/access.log trace;

# публичная модель на CPU: не больше 10 сообщений в минуту с одного IP
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

# Docker DNS: после пересоздания контейнера api у него новый IP.
# Без resolve nginx помнит старый адрес до перезапуска и отвечает 502.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream api {
    zone api 64k;
    server api:8000 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1m;

    # общие настройки прокси для всех location ниже
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;    # уникальный id запроса: по нему ищем его в логах всех сервисов
    proxy_connect_timeout 3s;                     # api остановлен -> 504 через 3 с, а не через минуту

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api/;                   # /api/jobs/1 -> /jobs/1
        proxy_read_timeout 30s;
    }

    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api/chat;
        proxy_buffering off;                      # токены отдавать сразу, не копить
        proxy_read_timeout 300s;                  # генерация длинного ответа
    }
}
